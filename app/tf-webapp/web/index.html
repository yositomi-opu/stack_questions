<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>True/False WebApp</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>True / False</strong><nav id="menus"></nav><button id="saveClose" hidden></button><button id="newQuestion" data-ja="新規" data-en="New"></button><button id="previewButton" data-ja="プレビュー" data-en="Preview"></button><select id="uiLanguage" aria-label="Application language"><option value="ja">日本語</option><option value="en">English</option></select></header>
<main><p id="status" role="status"></p><div id="form" hidden>
<div class="line"><label><span data-ja="問題名" data-en="Question name"></span><span id="dirty" aria-label="Unsaved"> </span><input id="name"></label><label><span data-ja="編集する文章の言語" data-en="Text language"></span><select id="textLanguage"></select></label><label><span data-ja="出題する主張" data-en="Statement selection"></span><select id="truth"><option value="random" data-ja="正／誤をランダムに出題" data-en="Random true / false"></option><option value="true" data-ja="正しい主張" data-en="True statements"></option><option value="false" data-ja="正しくない主張" data-en="False statements"></option></select></label></div>
<details><summary data-ja="問題変数" data-en="Question variables"></summary><textarea id="variables" rows="6" spellcheck="false"></textarea></details>
<details><summary data-ja="ライブラリー / stack_include" data-en="Libraries / stack_include"></summary><p class="hint" data-ja="MCQと同じ公開URLを指定します。1行に1つのURL。多言語ライブラリーは必須です。" data-en="Use the same published URLs as MCQ, one URL per line. The multilingual library is required."></p><textarea id="includes" rows="3" spellcheck="false"></textarea></details>
<label><span data-ja="出題指示（CASText）" data-en="Instruction (CASText)"></span><textarea id="question" rows="2"></textarea></label>
<h2 data-ja="正しい主張" data-en="True statements"></h2><div id="correct"></div><button id="addCorrect" data-ja="＋ 正しい主張" data-en="＋ True statement"></button>
<h2 data-ja="正しくない主張" data-en="False statements"></h2><div id="wrong"></div><button id="addWrong" data-ja="＋ 正しくない主張" data-en="＋ False statement"></button>
<p class="hint" data-ja="それぞれ1つ以上の欄を残します。各側からランダムに1つを選びます。「言語依存」を外した主張は共通CASTextとして使い、多言語展開から除外します。" data-en="Keep at least one statement on each side. One is sampled from the selected side. Uncheck Language-dependent for shared CASText excluded from translation."></p>
<div class="line"><label><span data-ja="正解時のフィードバック msgT" data-en="Feedback for a correct answer: msgT"></span><textarea id="feedbackTrue" rows="3"></textarea></label><label><span data-ja="不正解時のフィードバック msgF" data-en="Feedback for an incorrect answer: msgF"></span><textarea id="feedbackFalse" rows="3"></textarea></label></div>
<details><summary data-ja="回答ラベル・全般的フィードバック" data-en="Answer labels / general feedback"></summary><div class="line"><label>True<input id="labelTrue"></label><label>False<input id="labelFalse"></label></div><textarea id="generalfeedback" rows="3"></textarea></details>
<p class="hint" data-ja="「わからない」はこのTemplateでは未対応です。CSVに %_noidea=false を保持します。" data-en="This template does not offer I don't know. CSV retains %_noidea=false."></p>
<h2 data-ja="多言語" data-en="Languages"></h2><div id="languages"></div><label><span data-ja="標準言語" data-en="Base language"></span><select id="baseLanguage"></select></label><div class="line"><button id="translationRequest" data-ja="翻訳用JSONを表示" data-en="Prepare translation JSON"></button><button id="translationApply" data-ja="翻訳JSONを反映" data-en="Apply translation JSON"></button><button id="translateAI" data-ja="AIで展開（MCQ共通設定）" data-en="Translate with AI (MCQ settings)"></button></div><textarea id="translationJSON" rows="7" spellcheck="false"></textarea>
</div></main><input id="sourceFile" type="file" accept=".xml,.csv,.zip" hidden><script src="editor.js"></script><script src="preview.js"></script></body></html>
