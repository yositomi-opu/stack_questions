<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>True/False Question Editor</title><link rel="stylesheet" href="style.css?v=20261112-preview-globe"></head><body>
<header><strong>True/False Question Editor</strong><div class="header-actions"><button id="newQuestion" data-ja="新規" data-en="New"></button><nav id="menus"><button id="previewButton" class="primary" data-ja="プレビュー" data-en="Preview"></button></nav><button id="saveClose" hidden></button><select id="uiLanguage" aria-label="Application language"><option value="ja">日本語</option><option value="en">English</option></select></div></header>
<main><p id="status" role="status"></p><div id="form" hidden><p id="translationWarning" role="status" hidden></p>
<div class="line top-fields"><label class="name-field"><span data-ja="問題名" data-en="Question name"></span><span id="dirty" aria-label="Unsaved"> </span><input id="name"></label><label class="compact-field"><span data-ja="正解" data-en="Correct answer"></span><select id="truth"><option value="random" data-ja="ランダム" data-en="Random"></option><option value="true" data-ja="正しい" data-en="True"></option><option value="false" data-ja="正しくない" data-en="False"></option></select></label><label class="compact-field"><span><span data-ja="「わからない」を使用" data-en="Use ‘I don’t know’"></span><span class="help-wrap"><button type="button" class="help" aria-label="I don't know option help">?</button><span class="help-tip" role="tooltip" data-ja="Onにすると「わからない」を追加します。未回答の「-」とは別の選択肢です。表示文言は「回答ラベル」で言語ごとに編集できます。" data-en="On adds an I don’t know choice, separate from the unanswered “-” option. Edit its text per language under Answer labels."></span></span></span><select id="noIdea"><option value="false">Off</option><option value="true">On</option></select></label><label class="compact-field editing-language-field"><span data-ja="編集言語" data-en="Editing language"></span><select id="textLanguage"></select></label></div>
<section class="variables-panel" aria-labelledby="variablesTitle">
<div class="variables-heading"><h2 id="variablesTitle" data-ja="問題変数" data-en="Question variables"></h2><span class="help-wrap"><button type="button" class="help" aria-label="Question variables help" aria-describedby="variablesHelp">?</button><span id="variablesHelp" class="help-tip" role="tooltip" data-ja="%_tf と %_noidea はアプリが定義する変数で、問題変数のコードから参照できます。%_tf が 1 のときは「正しい」、2 のときは「正しくない」が正解です。%_noidea は「わからない」を使用する場合は true、使用しない場合は false です。" data-en="The editor defines %_tf and %_noidea for use in question variable code. If %_tf is 1, True is the correct answer. If it is 2, False is the correct answer. %_noidea is true when the I don’t know option is enabled and false otherwise."></span></span><button id="evaluateVariables" class="primary" data-ja="評価" data-en="Evaluate"></button><button id="evaluationResults" data-ja="評価結果" data-en="Evaluation results"></button><span id="evaluationStatus" role="status"></span><div class="library-base"><span>stack_include Base URL =</span><input id="libraryBaseUrl" readonly aria-label="stack_include Base URL"><button id="changeLibraryBase" data-ja="変更" data-en="Change"></button></div></div>
<textarea id="variables" rows="6" spellcheck="false" aria-labelledby="variablesTitle"></textarea>
<div class="shared-libraries"><strong id="libraryTitle" data-ja="共通ライブラリ:" data-en="Shared libraries:"></strong><div id="libraryIncludes"></div></div><p id="additionalLibraries" class="hint" hidden></p>
</section>
<label><span data-ja="問題文" data-en="Question text"></span><span class="help-wrap"><button type="button" class="help" aria-label="Question text help">?</button><span class="help-tip" role="tooltip" data-ja="CASText形式で書きます。HTMLと、問題変数を参照する {@a@} の形式を使用できます。選ばれた主張と結合して出題します。" data-en="Write CASText. HTML and references to question variables, such as {@a@}, are supported. This text is combined with the selected statement."></span></span><textarea id="question" rows="2"></textarea></label>
<section class="assertions-panel" aria-labelledby="assertionsTitle">
<div class="assertions-heading"><h2 id="assertionsTitle" data-ja="正しい/正しくない主張" data-en="True / false statements"></h2><span class="help-wrap"><button type="button" class="help" aria-label="Statements help" aria-describedby="assertionsHelp">?</button><span id="assertionsHelp" class="help-tip" role="tooltip" data-ja="正しい主張・正しくない主張を各1つ以上設定します。出題する側を決め、その側の主張からランダムに1つを選びます。「言語依存」を外した主張は共通CASTextとして使い、多言語展開から除外します。各欄の + で直後に同じ種類の主張を追加し、X で削除します。" data-en="Set at least one true and one false statement. The question selects a side, then randomly chooses one statement from that side. Uncheck Language-dependent to use shared CASText excluded from translation. Use + to insert a statement of the same kind immediately after that row, or X to delete it."></span></span></div>
<div id="correct"></div><div id="wrong"></div>
</section>
<div class="line"><label><span data-ja="正解時のフィードバック" data-en="Feedback for a correct answer"></span><span class="help-wrap"><button type="button" class="help" aria-label="Correct feedback help">?</button><span class="help-tip" role="tooltip" data-ja="正解時の説明です。CASText・HTML・{@a@} が使えます。XMLではmsgTへ設定します。" data-en="Feedback for a correct answer. Supports CASText, HTML and {@a@}. Assigned to msgT in XML."></span></span><textarea id="feedbackTrue" rows="3"></textarea></label><label><span data-ja="不正解時のフィードバック" data-en="Feedback for an incorrect answer"></span><span class="help-wrap"><button type="button" class="help" aria-label="Incorrect feedback help">?</button><span class="help-tip" role="tooltip" data-ja="不正解時の説明です。CASText・HTML・{@a@} が使えます。XMLではmsgFへ設定します。" data-en="Feedback for an incorrect answer. Supports CASText, HTML and {@a@}. Assigned to msgF in XML."></span></span><textarea id="feedbackFalse" rows="3"></textarea></label></div>
<details><summary data-ja="回答ラベル・全般的フィードバック" data-en="Answer labels / general feedback"></summary><div class="line"><label>True<input id="labelTrue"></label><label>False<input id="labelFalse"></label><label><span data-ja="「わからない」の表示" data-en="I don’t know label"></span><input id="labelNoIdea"></label></div><textarea id="generalfeedback" rows="3"></textarea></details>
<h2 id="languagesTitle" data-ja="多言語対応" data-en="Multilingual support"></h2><div class="language-settings"><div class="target-languages" role="group" aria-labelledby="targetLanguagesLabel"><span id="targetLanguagesLabel" data-ja="展開言語" data-en="Target languages"></span><div id="languages"></div></div></div><div class="line"><button id="translationRequest" data-ja="翻訳指示文を表示" data-en="Prepare translation prompt"></button><button id="translationApply" data-ja="翻訳JSONを反映" data-en="Apply translation JSON"></button><button id="translateAI" data-ja="AIで展開（MCQ共通設定）" data-en="Translate with AI (MCQ settings)"></button></div><textarea id="translationJSON" rows="7" spellcheck="false"></textarea><div id="translationStatus" role="status"></div>
</div></main><input id="sourceFile" type="file" accept=".csv" data-format="csv" hidden><script src="authoring-settings.js?v=20261108-es-layout"></script><script src="editor.js?v=20261114-compact-translation"></script><script src="preview.js?v=20261108-color"></script></body></html>
