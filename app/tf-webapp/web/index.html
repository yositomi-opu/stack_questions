<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>True/False WebApp</title><link rel="stylesheet" href="style.css?v=20261108-variables"></head><body>
<header><strong>True / False</strong><nav id="menus"></nav><button id="saveClose" hidden></button><button id="newQuestion" data-ja="新規" data-en="New"></button><button id="previewButton" data-ja="プレビュー" data-en="Preview"></button><select id="uiLanguage" aria-label="Application language"><option value="ja">日本語</option><option value="en">English</option></select></header>
<main><p id="status" role="status"></p><div id="form" hidden>
<div class="line"><label class="name-field"><span data-ja="問題名" data-en="Question name"></span><span id="dirty" aria-label="Unsaved"> </span><input id="name"></label><label><span data-ja="編集する文章の言語" data-en="Text language"></span><select id="textLanguage"></select></label><label><span data-ja="出題する主張" data-en="Statement selection"></span><select id="truth"><option value="random" data-ja="正／誤をランダムに出題" data-en="Random true / false"></option><option value="true" data-ja="正しい主張" data-en="True statements"></option><option value="false" data-ja="正しくない主張" data-en="False statements"></option></select></label></div>
<section class="variables-panel" aria-labelledby="variablesTitle">
<div class="variables-heading"><h2 id="variablesTitle" data-ja="問題変数" data-en="Question variables"></h2><button id="evaluateVariables" data-ja="評価" data-en="Evaluate"></button><button id="evaluationResults" data-ja="評価結果" data-en="Evaluation results"></button><span id="evaluationStatus" role="status"></span></div>
<div class="library-base"><span>stack_include Base URL =</span><input id="libraryBaseUrl" readonly aria-label="stack_include Base URL"><button id="changeLibraryBase" data-ja="変更" data-en="Change"></button></div>
<textarea id="variables" rows="6" spellcheck="false" aria-labelledby="variablesTitle"></textarea>
<div class="shared-libraries"><strong id="libraryTitle" data-ja="共通ライブラリ:" data-en="Shared libraries:"></strong><div id="libraryIncludes"></div></div><p id="additionalLibraries" class="hint" hidden></p>
</section>
<label><span data-ja="問題文" data-en="Question text"></span><span class="help-wrap"><button type="button" class="help" aria-label="Question text help">?</button><span class="help-tip" role="tooltip" data-ja="CASText形式で書きます。HTMLと、問題変数を参照する {@a@} の形式を使用できます。選ばれた主張と結合して出題します。" data-en="Write CASText. HTML and references to question variables, such as {@a@}, are supported. This text is combined with the selected statement."></span></span><textarea id="question" rows="2"></textarea></label>
<h2 data-ja="正しい主張" data-en="True statements"></h2><div id="correct"></div><button id="addCorrect" data-ja="＋ 正しい主張" data-en="＋ True statement"></button>
<h2 data-ja="正しくない主張" data-en="False statements"></h2><div id="wrong"></div><button id="addWrong" data-ja="＋ 正しくない主張" data-en="＋ False statement"></button>
<p class="hint" data-ja="それぞれ1つ以上の欄を残します。各側からランダムに1つを選びます。「言語依存」を外した主張は共通CASTextとして使い、多言語展開から除外します。" data-en="Keep at least one statement on each side. One is sampled from the selected side. Uncheck Language-dependent for shared CASText excluded from translation."></p>
<div class="line"><label><span data-ja="正解時のフィードバック" data-en="Feedback for a correct answer"></span><span class="help-wrap"><button type="button" class="help" aria-label="Correct feedback help">?</button><span class="help-tip" role="tooltip" data-ja="正解時の説明です。CASText・HTML・{@a@} が使えます。XMLではmsgTへ設定します。" data-en="Feedback for a correct answer. Supports CASText, HTML and {@a@}. Assigned to msgT in XML."></span></span><textarea id="feedbackTrue" rows="3"></textarea></label><label><span data-ja="不正解時のフィードバック" data-en="Feedback for an incorrect answer"></span><span class="help-wrap"><button type="button" class="help" aria-label="Incorrect feedback help">?</button><span class="help-tip" role="tooltip" data-ja="不正解時の説明です。CASText・HTML・{@a@} が使えます。XMLではmsgFへ設定します。" data-en="Feedback for an incorrect answer. Supports CASText, HTML and {@a@}. Assigned to msgF in XML."></span></span><textarea id="feedbackFalse" rows="3"></textarea></label></div>
<details><summary data-ja="回答ラベル・全般的フィードバック" data-en="Answer labels / general feedback"></summary><div class="line"><label>True<input id="labelTrue"></label><label>False<input id="labelFalse"></label></div><textarea id="generalfeedback" rows="3"></textarea></details>
<p class="hint" data-ja="「わからない」はこのTemplateでは未対応です。" data-en="This template does not offer I don't know."></p>
<h2 data-ja="多言語" data-en="Languages"></h2><div id="languages"></div><label><span data-ja="標準言語" data-en="Base language"></span><select id="baseLanguage"></select></label><div class="line"><button id="translationRequest" data-ja="翻訳用JSONを表示" data-en="Prepare translation JSON"></button><button id="translationApply" data-ja="翻訳JSONを反映" data-en="Apply translation JSON"></button><button id="translateAI" data-ja="AIで展開（MCQ共通設定）" data-en="Translate with AI (MCQ settings)"></button></div><textarea id="translationJSON" rows="7" spellcheck="false"></textarea>
</div></main><input id="sourceFile" type="file" accept=".xml,.csv,.zip" hidden><script src="authoring-settings.js?v=20261108-variables"></script><script src="editor.js?v=20261108-variables"></script><script src="preview.js"></script></body></html>
