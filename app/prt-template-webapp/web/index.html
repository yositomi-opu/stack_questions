<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRT Template WebApp</title><link rel="stylesheet" href="/style.css?v=20261028-save"><script defer src="/host.js?v=20261028-save"></script><script defer src="/skills.js?v=20261028-save"></script><script defer src="/editor.js?v=20261028-sample2"></script><script defer src="/files.js?v=20261028-save"></script><script defer src="/preview.js?v=20261028-matrix"></script></head><body>
<div class="app-shell"><header id="appHeader"><b role="heading" aria-level="1">PRT Template WebApp</b><nav><div id="fileMenus"></div><details id="projectMenu" class="file-menu"><summary id="projectMenuLabel">作業</summary><div class="menu-items"><button id="openXml" hidden></button><button id="exportXml" hidden></button><button id="openProject" type="button"></button><button id="saveProject">作業ZIP / Project ZIP</button><button id="originalDownload">原本 / Original</button></div></details><div id="headerActions"><button type="button" id="previewButton"></button><button id="saveStack" class="primary" type="submit" form="stackForm"></button></div><select id="language" aria-label="UI language"><option value="ja">日本語</option><option value="en">English</option></select></nav><input type="file" id="sourceFile" accept=".xml,.zip,.csv" hidden></header>
<p id="notice" role="status"></p><main><section id="startupPanel" class="panel" aria-live="polite"><p id="startupMessage">線形代数サンプルを準備しています / Loading the linear algebra sample…</p><button id="startSample" type="button" hidden>サンプルで新規開始 / Start a new sample</button><button id="reloadEditor" type="button" hidden>再読込 / Reload</button></section><h1 id="currentName" hidden></h1><button id="editStack" hidden></button><button id="continueEdit" hidden></button><span id="originalXmlLabel" hidden></span><span data-i18n="staticHelp" hidden></span>
<section id="stackEditor" class="stack-editor" hidden><form id="stackForm">
<div class="panel-heading"><h1 id="stackEditorTitle" hidden></h1><button type="button" id="closeStack" hidden></button></div><p id="stackHelp" hidden></p><p id="stackStatus" role="status"></p>
<div class="identity-row"><label class="name-field"><span id="dirtyMark" aria-live="polite"> </span><span id="stackNameLabel"></span><input id="stackName" required></label><section id="modePanel"></section></div>
<section id="libraryPanel" class="panel"></section>
<section class="panel"><div class="section-heading" id="variablesHeading"><h2 id="stackVariablesLabel"></h2><div id="definitionButtons"></div></div><textarea id="stackVariables" rows="12" spellcheck="false" aria-labelledby="stackVariablesLabel"></textarea></section>

<section id="questionPanel" class="panel"></section>
<section class="panel"><div class="section-heading"><h2 id="stackTextLabel"></h2><span id="layoutHelp"></span></div><textarea id="stackText" rows="5" spellcheck="false" aria-labelledby="stackTextLabel"></textarea></section>
<section id="templatePanel"></section>
<details class="panel" id="generalFeedbackPanel"><summary id="stackFeedbackLabel"></summary><textarea id="stackFeedback" rows="4" spellcheck="false" aria-labelledby="stackFeedbackLabel"></textarea></details>
<section id="languagePanel" class="panel"></section>
</form></section></main></div>
</body></html>
