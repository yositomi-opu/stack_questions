<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRT Template WebApp — Tree / Chain</title><link rel="stylesheet" href="/style.css"><script defer src="/host.js"></script><script defer src="/editor.js"></script><script defer src="/files.js"></script><script defer src="/preview.js"></script></head><body>
<header><b>PRT Template WebApp · Tree / Chain</b><nav><button id="openXml">XMLを開く / Open XML</button><button id="exportXml">XMLを保存 / Save XML</button><button id="saveProject">作業を保存 / Save project</button><button id="originalDownload">原本 / Original</button><select id="language"><option value="ja">日本語</option><option value="en">English</option></select></nav><input type="file" id="sourceFile" accept=".xml,.zip" hidden></header>
<p id="notice" role="status"></p><main><h1 id="currentName">PRT Template WebApp</h1><button id="editStack" hidden></button><button id="continueEdit" hidden>編集を続ける / Continue editing</button><p id="originalXmlLabel" hidden></p><span data-i18n="staticHelp" hidden></span></main>
<dialog id="stackEditor" class="stack-editor"><form id="stackForm">
<div class="panel-heading"><h2 id="stackEditorTitle"></h2><button type="button" id="closeStack"></button></div>
<p id="stackHelp" class="help"></p><p id="stackStatus" role="status"></p>
<label><span id="stackNameLabel"></span><input id="stackName" required></label>
<label><span id="stackVariablesLabel"></span><textarea id="stackVariables" rows="9" spellcheck="false"></textarea></label>
<label><span id="stackTextLabel"></span><textarea id="stackText" rows="8" spellcheck="false"></textarea></label>
<label><span id="stackFeedbackLabel"></span><textarea id="stackFeedback" rows="6" spellcheck="false"></textarea></label>
<div class="dialog-actions"><button type="button" id="previewButton"></button><button id="saveStack" class="primary"></button></div>
</form></dialog>
</body></html>
