<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parsons WebApp</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>Parsons WebApp · PRT-PARSON</strong><nav id="menus"></nav><button id="saveClose"></button><select id="uiLanguage" aria-label="Application language"><option value="ja">日本語</option><option value="en">English</option></select></header>
<main><p id="status" role="status"></p><div id="form" hidden>
<div class="line"><label><span data-ja="問題名" data-en="Question name"></span><input id="name" placeholder="問題のタイトル"></label><label><span data-ja="編集する文章の言語" data-en="Text language"></span><select id="textLanguage"></select></label></div>
<details><summary data-ja="問題変数" data-en="Question variables"></summary><textarea id="variables" rows="7" spellcheck="false"></textarea></details>
<label><span data-ja="問題文（CASText）" data-en="Question text (CASText)"></span><span class="help" tabindex="0" title="{@A@} などの問題変数を使用できます / You may reference question variables, e.g. {@A@}.">?</span><textarea id="question" rows="3"></textarea></label>
<h2 data-ja="選択肢・証明の手順" data-en="Choices / proof steps"></h2><div id="steps"></div><button id="addStep" data-ja="＋ 選択肢" data-en="＋ Choice"></button>
<h2 data-ja="正解例" data-en="Teacher answer"></h2><p class="hint" data-ja="手順IDをカンマで区切ります。各選択肢の＋で追加できます。使わない選択肢は含めません。" data-en="Comma-separated step IDs. Use ＋ on a choice to append it. Omit distractors."></p><input id="answer" class="wide"><div id="answerDisplay"></div>
<label><span data-ja="正解の判定" data-en="Accepted orders"></span><select id="grading"><option value="orders" data-ja="正解例と、追加した別の正解順序" data-en="Teacher answer and explicit alternatives"></option><option value="dag" data-ja="必要な手順が揃い、前後関係の制約を満たす全順序" data-en="All orders satisfying required steps and dependencies"></option></select></label>
<section id="orderSection"><h3 data-ja="別の正解順序" data-en="Alternative correct orders"></h3><div id="alternatives"></div><button id="addAlternative" data-ja="＋ 正解例を複製して別順序を追加" data-en="＋ Copy teacher answer as another order"></button></section>
<section id="dagSection"><label><span data-ja="前後関係の制約（1行に1つの並び）" data-en="Order constraints (one chain per line)"></span><textarea id="constraints" rows="4"></textarea></label><p class="hint" data-ja="例：s1,s2,s4 と s1,s3,s4 の2行なら、s2とs3は交換可能です。正解例にある手順はすべて必要で、余分な手順は認めません。" data-en="Example: chains s1,s2,s4 and s1,s3,s4 allow s2/s3 to swap. Every teacher-answer step is required; extra steps are rejected."></p></section>
<div class="line"><label><span data-ja="正解フィードバック" data-en="Correct feedback"></span><textarea id="feedbackTrue" rows="2"></textarea></label><label><span data-ja="誤答フィードバック" data-en="Incorrect feedback"></span><textarea id="feedbackFalse" rows="2"></textarea></label></div>
<details><summary data-ja="順序を試す" data-en="Try ordering the steps"></summary><p class="hint" data-ja="選択肢をクリックして追加し、ドラッグまたは↑↓で並べ替えます。ここでは設定した順序条件を確認できます。Moodleでの採点確認はXMLをインポートして行ってください。" data-en="Click a choice to add it; drag or use arrows to reorder. This checks the configured ordering rules. Import XML into Moodle to verify actual grading."></p><div id="tryChoices"></div><ol id="tryOrder"></ol><button id="checkOrder" data-ja="順序を確認" data-en="Check order"></button><span id="tryResult"></span></details>
<details><summary data-ja="全般的フィードバック（HTML / CASText）" data-en="General feedback (HTML / CASText)"></summary><textarea id="generalfeedback" rows="4"></textarea></details>
<h2 data-ja="多言語" data-en="Languages"></h2><div id="languages"></div><label><span data-ja="標準言語" data-en="Base language"></span><select id="baseLanguage"></select></label><div class="line"><button id="translationRequest" data-ja="翻訳指示文を表示" data-en="Prepare translation prompt"></button><button id="translationApply" data-ja="翻訳JSONを反映" data-en="Apply translation JSON"></button><button id="translateAI" data-ja="AIで展開（MCQ共通設定）" data-en="Translate with AI (MCQ settings)"></button></div><textarea id="translationJSON" rows="6" spellcheck="false"></textarea>
</div></main><input id="sourceFile" type="file" accept=".xml,.csv,.zip" hidden><script src="editor.js?v=20261113-translation"></script></body></html>
