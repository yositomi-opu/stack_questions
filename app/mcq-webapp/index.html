<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STACK MCQ XML Generator</title>
    <link rel="stylesheet" href="./styles.css?v=20260712-ui14">
    <script defer src="./vendor/xlsx.full.min.js"></script>
    <script defer src="./app.js?v=20260712-ui18"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">STACK / MCQ</p>
          <h1>XML Generator</h1>
        </div>
        <div class="actions">
          <button id="copyCasButton" type="button" class="ghost">CAS検証用コピー</button>
          <button id="downloadIncludeButton" type="button" class="ghost" hidden>include保存</button>
          <button id="sampleCsvButton" type="button" class="ghost">CSV見本</button>
          <button id="saveCsvButton" type="button" class="ghost">CSV保存</button>
          <button id="downloadButton" type="button" class="primary">XML保存</button>
        </div>
      </header>

      <section class="title-toolbar" aria-label="問題ファイル設定">
        <div class="title-field">
          <label class="sr-only" for="questionId">タイトル</label>
          <input id="questionId" value="" placeholder="例: NurseSample001" spellcheck="false">
        </div>
        <div class="file-field">
          <button id="dataFileButton" type="button" class="ghost">CSV/XLSX読込</button>
          <button id="xmlFileButton" type="button" class="ghost">XML読込</button>
          <input id="dataFileInput" class="visually-hidden-file" type="file" accept=".csv,.tsv,.xlsx,.xls">
          <input id="xmlFileInput" class="visually-hidden-file" type="file" accept=".xml,application/xml,text/xml">
        </div>
        <details class="display-settings">
          <summary>表示設定</summary>
          <div class="display-settings-menu">
            <label class="check-row display-option" for="showXml">
              <input id="showXml" type="checkbox" checked>
              <span>XMLを表示する</span>
            </label>
            <div class="field-row">
              <label for="settingsWidth">左欄の幅</label>
              <input id="settingsWidth" type="range" min="300" max="620" value="390">
            </div>
            <div class="field-row">
              <label for="dataWidth">選択肢欄の幅</label>
              <input id="dataWidth" type="range" min="420" max="900" value="620">
            </div>
          </div>
        </details>
      </section>

      <section class="workspace">
        <aside class="panel settings-panel">
          <section class="language-settings" aria-labelledby="languageHeading">
            <h2 id="languageHeading">多言語設定</h2>
            <div class="field-row base-language-row">
              <label for="baseLanguage">基本言語</label>
              <select id="baseLanguage"></select>
            </div>
            <p class="language-help">XMLに展開する言語を選択</p>
            <div id="languageChoices" class="language-choices"></div>
            <button id="prepareTranslationButton" type="button" class="primary translation-button">多言語展開</button>
            <details id="translationPanel" class="translation-panel">
              <summary>翻訳結果を確認・修正</summary>
              <p class="translation-guide">生成された依頼をChatGPTへ貼り付け、返されたJSONでこの欄を置き換えてから「結果を反映」を押してください。</p>
              <textarea id="translationJson" rows="12" spellcheck="false"></textarea>
              <div class="row-actions translation-actions">
                <button id="copyTranslationButton" type="button" class="ghost">依頼をコピー</button>
                <button id="applyTranslationButton" type="button" class="primary">結果を反映</button>
              </div>
              <p id="translationStatus" class="translation-status" aria-live="polite"></p>
            </details>
          </section>

          <div class="field-row qvars-field">
            <label for="qvars">問題変数（ランダム変数）</label>
            <textarea id="qvars" spellcheck="false" placeholder="aa1:rand([1, 2, 3])"></textarea>
          </div>

          <section class="question-texts" aria-labelledby="questionTextsHeading">
            <h2 id="questionTextsHeading">問題文</h2>
            <div id="questionTextFields"></div>
          </section>
        </aside>

        <div id="settingsResizeHandle" class="settings-resize-handle" role="separator" aria-orientation="vertical" aria-label="左欄の幅を変更" title="左右にドラッグして左欄の幅を変更"></div>

        <section class="panel data-panel">
          <section class="choice-settings" aria-labelledby="choiceSettingsHeading">
            <h2 id="choiceSettingsHeading">選択肢設定</h2>
            <div class="choice-settings-grid">
              <fieldset class="mode-options">
                <legend>形式</legend>
                <label><input id="modeRb" type="radio" name="mode" value="rb" checked> Radio</label>
                <label><input id="modeCb" type="radio" name="mode" value="cb"> Checkbox</label>
              </fieldset>
              <div class="number-grid">
                <div class="field-row">
                  <label for="numOptions">選択肢数</label>
                  <input id="numOptions" type="number" min="1" max="99" value="2">
                </div>
                <div class="field-row">
                  <label for="numCorrect">正解選択肢数</label>
                  <input id="numCorrect" type="number" min="0" max="99" value="1">
                </div>
              </div>
              <div class="choice-flags">
                <div class="random-correct-row">
                  <label class="check-row" for="randomCorrect">
                    <input id="randomCorrect" type="checkbox">
                    <span>正解数をランダムにする</span>
                  </label>
                  <div id="correctCountsRow" class="correct-counts" hidden>
                    <label for="correctCounts">候補</label>
                    <input id="correctCounts" value="1, 2" spellcheck="false" placeholder="1, 2, 3">
                  </div>
                </div>
                <label class="check-row" for="requirePairs">
                  <input id="requirePairs" type="checkbox" checked>
                  <span>各パターンは真偽1対以上を必須とする</span>
                </label>
              </div>
            </div>
          </section>
          <div class="section-divider"></div>
          <div class="panel-heading">
            <h2>選択肢データ</h2>
            <div class="row-actions">
              <button id="addRowButton" type="button" class="ghost">行追加</button>
              <button id="clearRowsButton" type="button" class="ghost danger">クリア</button>
            </div>
          </div>
          <div id="pairedEditor" class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>パターン</th>
                  <th>真偽</th>
                  <th id="choiceLanguageHeading">選択肢 ja</th>
                  <th id="feedbackLanguageHeading">共通FB ja</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rowsBody"></tbody>
            </table>
          </div>
          <div id="fixedEditor" class="fixed-editor" hidden>
            <section class="fixed-section">
              <div class="fixed-heading">
                <h3>正解選択肢</h3>
                <button id="addCorrectPatternButton" type="button" class="ghost">正解パターン追加</button>
              </div>
              <div class="table-wrap">
                <table class="fixed-table">
                  <thead><tr><th>パターン</th><th>選択肢リスト（1行1要素）</th><th>フィードバック</th><th></th></tr></thead>
                  <tbody id="correctPatternsBody"></tbody>
                </table>
              </div>
            </section>
            <section class="fixed-section">
              <div class="fixed-heading">
                <h3>誤答選択肢</h3>
                <button id="addWrongPatternButton" type="button" class="ghost">誤答パターン追加</button>
              </div>
              <div class="table-wrap">
                <table class="fixed-table">
                  <thead><tr><th>パターン</th><th>選択肢リスト（1行1要素）</th><th>フィードバック</th><th></th></tr></thead>
                  <tbody id="wrongPatternsBody"></tbody>
                </table>
              </div>
            </section>
          </div>
          <p id="statusLine" class="status" aria-live="polite"></p>
        </section>

        <div id="xmlPane" class="xml-pane">
          <button id="xmlToggleTab" class="xml-toggle-tab" type="button" aria-pressed="true" title="生成XMLの表示を切り替え">XML</button>
          <div id="xmlResizeHandle" class="xml-resize-handle" role="separator" aria-orientation="vertical" aria-label="XML欄の幅を変更" title="左へドラッグで広げる／右へドラッグで狭める"></div>
          <section id="outputPanel" class="panel output-panel">
            <div class="panel-heading">
              <h2>生成XML</h2>
              <button id="copyButton" type="button" class="ghost">コピー</button>
            </div>
            <textarea id="xmlOutput" spellcheck="false"></textarea>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
