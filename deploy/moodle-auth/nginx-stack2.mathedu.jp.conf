# MCQ WebApp access gateway for https://stack2.mathedu.jp/moodle
#
# Add these four locations inside the HTTPS `server {}` block containing:
#     server_name stack2.mathedu.jp localhost;
#
# Do not add them to the port 80 block which redirects to HTTPS.

location = /_mcq_webapp_auth {
    internal;

    include /etc/nginx/fastcgi_params;
    fastcgi_pass_request_body off;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param QUERY_STRING "";
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_param SCRIPT_FILENAME /home/www/htdocs/moodle/local/mcqwebapp/auth.php;
    fastcgi_param SCRIPT_NAME /moodle/local/mcqwebapp/auth.php;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

location = /moodle/mcq-webapp {
    return 301 /moodle/mcq-webapp/;
}

# Never expose the local service-control endpoint through Nginx.
location = /moodle/mcq-webapp/api/server/shutdown {
    return 404;
}

location ^~ /moodle/mcq-webapp/ {
    auth_request /_mcq_webapp_auth;

    # A logged-out browser is sent through Moodle's normal login flow.
    error_page 401 =302 /moodle/local/mcqwebapp/launch.php;

    # The trailing slash removes /moodle/mcq-webapp/ before proxying.
    proxy_pass http://127.0.0.1:4173/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /moodle/mcq-webapp;
    proxy_read_timeout 120s;
}
