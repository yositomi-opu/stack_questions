# Installed under sites-available (included inside nginx's http context).
# Replace practice.example.org before enabling; then obtain HTTPS with Certbot.
limit_req_zone $binary_remote_addr zone=mcq_practice:10m rate=2r/s;

server {
    listen 80;
    server_name practice.example.org;
    client_max_body_size 64k;
    client_body_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location /api/ {
        limit_req zone=mcq_practice burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
